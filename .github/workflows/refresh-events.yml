name: Refresh event providers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install backend
        working-directory: backend
        run: uv sync

      - name: Collect provider snapshot
        working-directory: backend
        run: uv run python -m app.scripts.seed_events collect --output /tmp/build-dallas-events.json

      - name: Import into Supabase
        working-directory: backend
        run: uv run python -m app.scripts.supabase_import --input /tmp/build-dallas-events.json

      # Provider embeddings are intentionally disabled for now.
      # The hosted Edge Runtime is returning WORKER_RESOURCE_LIMIT even for small
      # gte-small batches. Event discovery still works without embeddings; only
      # semantic "For You" ranking is deferred until we move embedding generation
      # to a compute path that is reliable on this project.
