[project]
name = "build-dallas-backend"
version = "0.1.0"
description = "Template FastAPI backend for Build Dallas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.32",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6.0",
    "workers-py>=1.17.3",
    "workers-runtime-sdk>=1.8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src/app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
